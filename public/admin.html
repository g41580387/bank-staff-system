<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Backend - System Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            color: #333;
        }
        .header a {
            color: #0072c6;
            text-decoration: none;
            font-weight: bold;
        }
        
        /* 标签页样式 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #0072c6;
        }
        .tab-btn {
            background-color: #f1f1f1;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            color: #555;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: #0072c6;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* 表单样式 */
        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .input-box {
            flex: 1;
            min-width: 200px;
        }
        .input-box label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        .input-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.save-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button.save-btn:hover { background-color: #218838; }
        
        button.clear-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        
        button.edit-btn {
            background-color: #ffc107;
            color: #333;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            margin-right: 5px;
        }

        /* 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #1a1a1a;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .delete-btn {
            color: white;
            background-color: red;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Backend Control Panel</h2>
            <a href="index.html">&larr; Back to Main Portal</a>
        </div>

        <!-- 标签页控制 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('staffTab', this)">Staff Management</button>
            <button class="tab-btn" onclick="switchTab('accountTab', this)">System Accounts</button>
        </div>

        <!-- 1. 员工管理区域 -->
        <div id="staffTab" class="tab-content active">
            <form id="staffForm">
                <div class="form-group">
                    <div class="input-box">
                        <label>Name (名字)</label>
                        <input type="text" id="staffName" placeholder="e.g. WONG HUI YI" required>
                    </div>
                    <div class="input-box">
                        <label>Staff Code (员工ID)</label>
                        <input type="text" id="staffCode" placeholder="e.g. 455986" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-box">
                        <label>Mobile Number (手机号码)</label>
                        <input type="text" id="staffNumber" placeholder="e.g. +60 10-204 8405" required>
                    </div>
                    <div class="input-box">
                        <label>Department (部门)</label>
                        <input type="text" id="staffDept" placeholder="e.g. Seri Kembangan" required>
                    </div>
                </div>
                <button type="submit" class="save-btn">Save Staff</button>
                <button type="button" class="clear-btn" onclick="clearAllData()">Clear All Records</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>NAME</th>
                        <th>STAFF ID / CODE</th>
                        <th>MOBILE NUMBER</th>
                        <th>DEPARTMENT</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- 员工数据 -->
                </tbody>
            </table>
        </div>

        <!-- 2. 账号密码管理区域 (新增) -->
        <div id="accountTab" class="tab-content">
            <form id="accountForm">
                <input type="hidden" id="editAccountId"> <!-- 用于判断是新增还是修改 -->
                <div class="form-group">
                    <div class="input-box">
                        <label>Username (登入账号)</label>
                        <input type="text" id="accUsername" placeholder="Enter username" required>
                    </div>
                    <div class="input-box">
                        <label>Password (密码)</label>
                        <input type="text" id="accPassword" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="save-btn" id="accSaveBtn">Add Account</button>
                <button type="button" class="clear-btn" onclick="resetAccountForm()" style="display:none;" id="accCancelBtn">Cancel Edit</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>USERNAME</th>
                        <th>PASSWORD</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="accountTableBody">
                    <!-- 账号数据 -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // --- 标签页切换逻辑 ---
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // ==========================================
        // 1. STAFF MANAGEMENT LOGIC (员工管理逻辑)
        // ==========================================
        const form = document.getElementById('staffForm');
        const tableBody = document.getElementById('dataTableBody');

        async function loadData() {
            try {
                const response = await fetch('/api/staff');
                const data = await response.json();
                renderTable(data);
            } catch (error) { console.error('Error:', error); }
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach((staff, index) => {
                const row = `
                    <tr>
                        <td style="color:#0072c6; font-weight:bold;">${staff.name}</td>
                        <td>${staff.code}</td>
                        <td>${staff.number}</td>
                        <td>${staff.dept}</td>
                        <td><button class="delete-btn" onclick="deleteRecord(${index})">Delete</button></td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', row);
            });
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const newStaff = {
                name: document.getElementById('staffName').value.toUpperCase(),
                code: document.getElementById('staffCode').value,
                number: document.getElementById('staffNumber').value,
                dept: document.getElementById('staffDept').value
            };
            await fetch('/api/staff', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newStaff)
            });
            form.reset(); 
            loadData(); 
        });

        async function deleteRecord(index) {
            if(confirm("Delete this record?")) {
                await fetch(`/api/staff/${index}`, { method: 'DELETE' });
                loadData();
            }
        }

        async function clearAllData() {
            if(confirm("Are you sure you want to clear ALL records?")) {
                await fetch('/api/staff-clear', { method: 'DELETE' });
                loadData();
            }
        }


        // ==========================================
        // 2. ACCOUNT MANAGEMENT LOGIC (账号管理逻辑)
        // ==========================================
        const accForm = document.getElementById('accountForm');
        const accTableBody = document.getElementById('accountTableBody');
        let currentAccounts = []; // 本地缓存列表，方便编辑

        async function loadAccounts() {
            try {
                const response = await fetch('/api/accounts');
                currentAccounts = await response.json();
                renderAccountTable(currentAccounts);
            } catch (error) { console.error('Error loading accounts:', error); }
        }

        function renderAccountTable(data) {
            accTableBody.innerHTML = '';
            data.forEach((acc, index) => {
                const row = `
                    <tr>
                        <td style="font-weight:bold;">${acc.username}</td>
                        <td>${acc.password}</td>
                        <td>
                            <button class="edit-btn" onclick="editAccount(${index})">Edit</button>
                            <button class="delete-btn" onclick="deleteAccount(${index})">Delete</button>
                        </td>
                    </tr>
                `;
                accTableBody.insertAdjacentHTML('beforeend', row);
            });
        }

        accForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const editId = document.getElementById('editAccountId').value;
            const accountData = {
                username: document.getElementById('accUsername').value,
                password: document.getElementById('accPassword').value
            };

            if (editId !== "") {
                // 如果是修改状态 (PUT)
                await fetch(`/api/accounts/${editId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(accountData)
                });
            } else {
                // 如果是新增状态 (POST)
                await fetch('/api/accounts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(accountData)
                });
            }

            resetAccountForm();
            loadAccounts();
        });

        // 点击编辑按钮时，将数据填入上方表单
        function editAccount(index) {
            const acc = currentAccounts[index];
            document.getElementById('editAccountId').value = index;
            document.getElementById('accUsername').value = acc.username;
            document.getElementById('accPassword').value = acc.password;
            
            document.getElementById('accSaveBtn').textContent = "Update Account";
            document.getElementById('accSaveBtn').style.backgroundColor = "#ffc107";
            document.getElementById('accSaveBtn').style.color = "#333";
            document.getElementById('accCancelBtn').style.display = "inline-block";
        }

        // 退出编辑状态
        function resetAccountForm() {
            accForm.reset();
            document.getElementById('editAccountId').value = "";
            document.getElementById('accSaveBtn').textContent = "Add Account";
            document.getElementById('accSaveBtn').style.backgroundColor = "#28a745";
            document.getElementById('accSaveBtn').style.color = "white";
            document.getElementById('accCancelBtn').style.display = "none";
        }

        // 删除账号
        async function deleteAccount(index) {
            if(confirm(`Delete account '${currentAccounts[index].username}'?`)) {
                await fetch(`/api/accounts/${index}`, { method: 'DELETE' });
                loadAccounts();
            }
        }

        // 初始化加载数据
        loadData();
        loadAccounts();
    </script>
</body>
</html>
